<h1>My Profile 👤</h1>
<br> <br> <br>
<form id="profileForm">

  <input
    type="text"
    id="name"
    placeholder="Full Name"
    required
  >

  <br><br>

  <input
    type="email"
    id="email"
    disabled
  >

  <br><br>

  <input
    type="text"
    id="mobile"
    placeholder="Mobile Number"
  >

  <br><br>

  <textarea
    id="address"
    placeholder="Address"
  ></textarea>

  <br><br>

  <button type="submit">
    Save Profile
  </button>

</form>
